[project]
name = "agent-scheduler"
version = "0.1.0"
description = "Agent-facing scheduler for headless agent workflows orchestrated by Prefect."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "prefect>=3.4.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "typer>=0.15.0",
]

[project.scripts]
agent-scheduler = "agent_scheduler.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
