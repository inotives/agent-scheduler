services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: ${POSTGRES_DB:-prefect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  prefect-server:
    build:
      context: .
    environment:
      PREFECT_HOME: /app/.prefect
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL:-postgresql+asyncpg://prefect:prefect@postgres:5432/prefect}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://127.0.0.1:4200/api}
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "${PREFECT_SERVER_PORT:-4200}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - prefect-home:/app/.prefect

  prefect-worker:
    build:
      context: .
    environment:
      PREFECT_HOME: /app/.prefect
      PREFECT_API_URL: ${PREFECT_WORKER_API_URL:-http://prefect-server:4200/api}
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    command:
      [
        "prefect",
        "worker",
        "start",
        "--pool",
        "${PREFECT_WORK_POOL:-agent-scheduler}",
        "--type",
        "process",
        "--limit",
        "${AGENT_SCHEDULER_WORKER_LIMIT:-2}",
        "--name",
        "${PREFECT_WORKER_NAME:-agent-scheduler-worker}",
        "--install-policy",
        "never",
      ]
    depends_on:
      - prefect-server
    profiles:
      - worker
    volumes:
      - prefect-home:/app/.prefect

  scheduler-cli:
    build:
      context: .
    environment:
      PREFECT_API_URL: ${PREFECT_WORKER_API_URL:-http://prefect-server:4200/api}
    command: ["agent-scheduler", "--help"]
    depends_on:
      - prefect-server
    profiles:
      - tools

volumes:
  postgres-data:
  prefect-home:

